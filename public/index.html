<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FileLab</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    input, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg2); color: inherit; }
    button { cursor: pointer; background: var(--grad); border: none; color: white; font-weight: 600; }
    button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
    article { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 10px 0; background: var(--panel2); }
    a { color: #8fb0ff; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <header style="margin-bottom: 24px;"><b style="font-size: 22px;">FILELAB</b> <small style="color: var(--muted);">HOSTING CONTROL CENTER</small></header>
  <main>
    <section id="login" class="panel">
      <h1>FileLab Hosting</h1>
      <p>Sign in to manage your websites.</p>
      <form id="loginForm">
        <input id="password" type="password" placeholder="Admin password" required style="width:100%; margin: 8px 0;">
        <button type="submit">Sign in</button>
      </form>
      <p id="err" class="error"></p>
    </section>
    <section id="dash" class="panel" hidden>
      <h1>Your websites</h1>
      <form id="create">
        <input id="name" placeholder="Website name" required style="width:70%;">
        <button type="submit">Create website</button>
      </form>
      <p id="notice" style="margin: 12px 0;"></p>
      <div id="sites"></div>
      <button id="logout" class="secondary" style="margin-top: 16px;">Sign out</button>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
